<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>{% block titulo %}Avaliações físicas{% endblock %} - SheFit</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 28px 16px; font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #7c3aed, #ec4899); color: #1f2937; }
        main { max-width: 900px; margin: auto; }
        .card { background: #fff; border-radius: 16px; padding: 28px; margin-bottom: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.15); }
        h1, h2, h3 { color: #6d28d9; margin-top: 0; }
        h1 { font-size: 1.7rem; }
        h2 { font-size: 1.15rem; }
        h3 { font-size: 1rem; margin-bottom: 6px; }
        .topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .acoes { display: flex; flex-wrap: wrap; gap: 10px; }
        .botao { border: 0; border-radius: 8px; padding: 11px 15px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; display: inline-block; }
        .primario { background: #7c3aed; color: #fff; }
        .secundario { background: #f3f4f6; color: #374151; }
        .pequeno { padding: 7px 11px; font-size: .88rem; }
        .badge { display: inline-block; border-radius: 12px; padding: 3px 10px; font-size: .8rem; background: #ede9fe; color: #6d28d9; }
        .badge.aviso { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
        .badge.cinza { background: #f3f4f6; color: #6b7280; }
        .aviso-caixa { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 14px; margin: 10px 0; }
        .mensagem { border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; background: #ede9fe; color: #5b21b6; }
        .mensagem.error { background: #fef2f2; color: #b91c1c; }
        .mensagem.success { background: #ecfdf5; color: #065f46; }
        .metricas { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 14px 0; }
        .metrica { background: #faf5ff; border-radius: 10px; padding: 10px 12px; }
        .metrica span { display: block; font-size: .78rem; color: #6b7280; }
        .metrica strong { font-size: 1.05rem; }
        .discreto { color: #6b7280; font-size: .9rem; }
        .campo { margin-bottom: 14px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
        .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .erro { color: #b91c1c; font-size: .9rem; margin: 4px 0 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 8px; border-top: 1px solid #e5e7eb; vertical-align: top; }
        th { color: #6b7280; font-size: .85rem; font-weight: 600; border-top: 0; }
        td.num, th.num { text-align: right; white-space: nowrap; }
        @media (max-width: 600px) { .card { padding: 20px; } .grade { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main>
    {% if messages %}
        {% for mensagem in messages %}
            <div class="mensagem {{ mensagem.tags }}">{{ mensagem }}</div>
        {% endfor %}
    {% endif %}
    {% block conteudo %}{% endblock %}
</main>
</body>
</html>
