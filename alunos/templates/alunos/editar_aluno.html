{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Aluna - SheFit</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #7c3aed;
            text-align: center;
            margin-bottom: 4px;
            font-size: 1.8rem;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #334155;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #7c3aed;
        }

        .btn-salvar {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            transition: opacity 0.2s;
        }

        .btn-salvar:hover {
            opacity: 0.9;
        }

        .btn-cancelar {
            display: block;
            width: 100%;
            padding: 10px;
            background: #f1f5f9;
            color: #475569;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            margin-top: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cancelar:hover {
            background: #e2e8f0;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>SheFit</h1>
        <p class="subtitle">Editar dados cadastrais: <strong>{{ aluno.nome }}</strong></p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div style="color: #dc2626; font-size: 0.8rem; margin-top: 4px;">
                            {{ field.errors|striptags }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn-salvar">Salvar Alterações</button>
            <a href="{% url 'painel_recepcao' %}" class="btn-cancelar">Cancelar</a>
        </form>
    </div>
</body>

</html>
