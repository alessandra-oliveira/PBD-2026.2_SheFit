{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastrar Aluno - SheFit</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #7c3aed;
            text-align: center;
            margin-bottom: 4px;
            font-size: 1.8rem;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 4px;
            font-size: 0.95rem;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        input[type="file"] {
            padding: 8px 4px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background: #6d28d9;
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(124, 58, 237, 0.35);
        }

        button:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(124, 58, 237, 0.35);
        }

        .erro {
            color: #b91c1c;
            font-size: 0.85em;
            margin-top: 4px;
        }

        .sucesso {
            background: #dcfce7;
            color: #166534;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        /* Telas pequenas (celular) */
        @media (max-width: 480px) {
            .card {
                padding: 24px 20px;
                border-radius: 12px;
            }

            h1 {
                font-size: 1.5rem;
            }

            button {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>SheFit</h1>
        <p class="subtitle">Cadastro de Aluno</p>

        {% if messages %}
        {% for message in messages %}
        <div class="sucesso">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="post" enctype="multipart/form-data" autocomplete="off">
            {% csrf_token %}
            {% for field in form %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="erro">{{ field.errors.0 }}</div>
            {% endif %}
            {% endfor %}
            <button type="submit">Avançar para Anamnese</button>
        </form>
    </div>
</body>

</html>
