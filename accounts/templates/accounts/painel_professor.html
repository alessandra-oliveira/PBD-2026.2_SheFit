<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Painel do Professor - SheFit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        .logo {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
            color: #7c3aed;
            margin-bottom: 4px;
        }
        .badge {
            display: inline-block;
            background: #ede9fe;
            color: #6d28d9;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .saudacao {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }
        .descricao {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .botao-sair {
            display: block;
            width: 100%;
            padding: 13px;
            background: #f3f4f6;
            color: #4b5563;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
        }
        .botao-sair:hover {
            background: #fee2e2;
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">SheFit</div>
        <div class="badge">Professor</div>
        <h2 class="saudacao">Olá, {{ request.user.username }}!</h2>
        <p class="descricao">Área de acompanhamento de treinos e fichas dos alunos.</p>
        <a href="{% url 'sair' %}" class="botao-sair">Sair da conta</a>
    </div>
</body>
</html>
